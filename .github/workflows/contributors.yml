name: "Update contributors"
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  contrib-readme-job:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
